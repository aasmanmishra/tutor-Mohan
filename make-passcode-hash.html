<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Passcode hash maker</title>
<style>body{font-family:system-ui,sans-serif;max-width:520px;margin:40px auto;padding:0 16px}
input{width:100%;padding:10px;font:inherit;margin:6px 0}textarea{width:100%;height:70px;font-family:monospace}</style></head>
<body>
<h2>Teacher passcode hash maker</h2>
<p>Type a teacher's passcode, then paste the hash into that teacher's line in <code>TEACHERS</code> in <code>config.js</code>. Give every teacher a different passcode.
Runs only in your browser; nothing is sent anywhere.</p>
<input id="p" type="text" placeholder="New passcode">
<textarea id="o" readonly></textarea>
<script>
document.getElementById("p").addEventListener("input", async e => {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(e.target.value));
  document.getElementById("o").value = Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,"0")).join("");
});
</script></body></html>
